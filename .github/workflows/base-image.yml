name: Build Base Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. 0.3.0)"
        required: true
      prerelease:
        description: "Is this a prerelease? (true/false)"
        required: false
        default: "false"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: devon-white/claude-bunker

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Determine version tag
        id: version
        run: |
          echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Dockerfile and build context
        run: |
          go build -o claude-bunker .
          ./claude-bunker --dump-dockerfile build-context
          echo "--- Generated Dockerfile ---"
          cat build-context/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: build-context
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ steps.version.outputs.tag }}
            ${{ steps.version.outputs.prerelease != 'true' && format('{0}/{1}:latest', env.REGISTRY, env.IMAGE_NAME) || '' }}
          build-args: |
            TZ=UTC
