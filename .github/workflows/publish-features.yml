# Publishes claude-bunker's OCI Dev Container Features (features/src/firewall,
# features/src/hardening) to ghcr.io/Devon-White/claude-bunker/{firewall,hardening}.
#
# This is DELIBERATELY MANUAL and separate from the CLI release path:
#   - release.yml owns `v*` tags (goreleaser: CLI binaries + Homebrew).
#   - base-image.yml is dispatched by release.yml to publish the base Docker
#     image (devon-white/claude-bunker on GHCR).
#   - This workflow owns publishing the two Features, and does NOT run on
#     ordinary pushes/PRs — only `workflow_dispatch` or a `features-vX.Y.Z`
#     tag (distinct from the CLI's `vX.Y.Z` tags) trigger it. A routine
#     `git push` to master publishes nothing.
#
# ONE-TIME MANUAL STEP: the first successful run creates the GHCR packages
# ghcr.io/devon-white/claude-bunker/firewall and .../hardening as PRIVATE by
# default. Each must be made public by hand afterward (package -> Package
# settings -> Change visibility) before `claude-bunker init`-generated
# devcontainer.json files — or any VS Code / Codespaces user — can pull them
# anonymously. Subsequent publishes to an already-public package don't need
# this repeated.
name: Publish Features

on:
  workflow_dispatch: {}
  push:
    tags:
      - "features-v*"

permissions:
  packages: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish Features to GHCR
        uses: devcontainers/action@v1
        with:
          publish-features: "true"
          base-path-to-features: "features/src"
          oci-registry: "ghcr.io"
          features-namespace: "Devon-White/claude-bunker"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
