# Prefix: Ctrl-a (more ergonomic than default Ctrl-b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# General settings
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0
set -g focus-events on

# Mouse support
set -g mouse on

# Intuitive split keys
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Pane navigation with Alt+arrow (no prefix needed)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Pane resizing with Ctrl+arrow (no prefix needed)
bind -n C-Left resize-pane -L 2
bind -n C-Right resize-pane -R 2
bind -n C-Up resize-pane -U 2
bind -n C-Down resize-pane -D 2

# Quick pane cycling with prefix + Tab
bind Tab select-pane -t :.+

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off

# Status bar
set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=colour235,fg=colour248"

# Left status: session name
set -g status-left-length 30
set -g status-left "#[fg=colour232,bg=colour39,bold] #S #[fg=colour39,bg=colour235] "

# Window status
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=colour235,bg=colour39]#[fg=colour232,bg=colour39,bold] #I:#W #[fg=colour39,bg=colour235]"
setw -g window-status-separator ""

# Right status: pane title, date, time
set -g status-right-length 60
set -g status-right "#[fg=colour248] #{pane_title} #[fg=colour39]| #[fg=colour248]%Y-%m-%d %H:%M "

# Pane borders
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour39"

# Synchronize panes toggle (useful for sending same command to all agents)
bind S setw synchronize-panes \; display "Sync #{?synchronize-panes,ON,OFF}"

# Quick layout presets for agent monitoring
bind M-1 select-layout even-horizontal
bind M-2 select-layout even-vertical
bind M-3 select-layout main-horizontal
bind M-4 select-layout main-vertical
bind M-5 select-layout tiled
